<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse - fichier</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 2rem;
            max-width: 900px;
            width: 100%;
        }
        h1 {
            color: #1f2937;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e5e7eb;
        }
        #chart { display: flex; justify-content: center; }
        .footer {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #e5e7eb;
            text-align: center;
            color: #6b7280;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Profilage des Questions</h1>
        <div id="chart"></div>
        <div class="footer">Généré le 09/01/2026</div>
    </div>
    <script>
        vegaEmbed('#chart', {
  "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
  "title": {
    "text": "Analyse du fichier : fichier",
    "subtitle": "Total de questions : 21",
    "fontSize": 20,
    "subtitleFontSize": 14,
    "anchor": "start"
  },
  "width": 600,
  "height": 400,
  "data": {
    "values": [
      {
        "type": "Mot manquant",
        "count": 18,
        "percentage": "85.7"
      },
      {
        "type": "Question ouverte",
        "count": 2,
        "percentage": "9.5"
      },
      {
        "type": "Description/Info",
        "count": 1,
        "percentage": "4.8"
      },
      {
        "type": "Choix multiples",
        "count": 0,
        "percentage": "0.0"
      },
      {
        "type": "Vrai / Faux",
        "count": 0,
        "percentage": "0.0"
      },
      {
        "type": "Correspondance",
        "count": 0,
        "percentage": "0.0"
      },
      {
        "type": "Numérique",
        "count": 0,
        "percentage": "0.0"
      },
      {
        "type": "Choix multiple (Crédit)",
        "count": 0,
        "percentage": "0.0"
      },
      {
        "type": "Autre",
        "count": 0,
        "percentage": "0.0"
      }
    ]
  },
  "mark": {
    "type": "bar",
    "cornerRadiusEnd": 6,
    "color": {
      "x1": 1,
      "y1": 1,
      "x2": 0,
      "y2": 0,
      "gradient": "linear",
      "stops": [
        {
          "offset": 0,
          "color": "#3b82f6"
        },
        {
          "offset": 1,
          "color": "#8b5cf6"
        }
      ]
    }
  },
  "encoding": {
    "y": {
      "field": "type",
      "type": "nominal",
      "title": "Type de question",
      "sort": "-x",
      "axis": {
        "labelFontSize": 12,
        "titleFontSize": 14
      }
    },
    "x": {
      "field": "count",
      "type": "quantitative",
      "title": "Nombre de questions",
      "axis": {
        "labelFontSize": 12,
        "titleFontSize": 14
      }
    },
    "tooltip": [
      {
        "field": "type",
        "title": "Type"
      },
      {
        "field": "count",
        "title": "Nombre"
      },
      {
        "field": "percentage",
        "title": "Pourcentage (%)",
        "format": ".1f"
      }
    ]
  },
  "config": {
    "background": "#fafafa",
    "font": "system-ui, -apple-system, sans-serif",
    "axis": {
      "gridColor": "#e5e7eb"
    }
  }
}, {
            actions: { export: true, source: false, compiled: false, editor: false }
        });
    </script>
</body>
</html>
